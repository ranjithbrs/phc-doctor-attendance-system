<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Doctor Dashboard</title>

  <!-- Bootstrap -->

  <link
    href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
    rel="stylesheet"
  >

  <!-- Leaflet CSS & JS for Geo-Fence Map -->
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>

  <style>

    body {

      background: linear-gradient(135deg, #eef2ff, #f8fafc);

      min-height: 100vh;

      font-family:
        'Segoe UI',
        Tahoma,
        Geneva,
        Verdana,
        sans-serif;

    }

    .dashboard-card {

      max-width: 950px;

      margin: 40px auto;

      border-radius: 18px;

      background: white;

      box-shadow: 0 10px 25px rgba(0,0,0,0.08);

      padding: 30px;

    }

    .status-box {

      border-radius: 14px;

      background: #f1f5f9;

      padding: 25px;

      text-align: center;

      margin-bottom: 25px;

    }

    .big-btn {

      padding: 14px;

      font-size: 18px;

      border-radius: 12px;

      font-weight: 600;

    }

    .header-title {

      font-weight: 700;

    }

    .date-text {

      color: #64748b;

      font-size: 15px;

    }

  </style>

</head>

<body>

<div class="container">

  <div class="dashboard-card">

    <!-- HEADER -->

    <div
      class="d-flex justify-content-between align-items-center mb-3"
    >

      <h2 class="header-title m-0">

        👨‍⚕️ Doctor Dashboard -
        <span id="doctorName"></span>

      </h2>

      <button
        class="btn btn-secondary"
        onclick="logout()"
      >

        Logout

      </button>

    </div>

    <!-- DATE -->

    <p
      class="date-text text-center mb-4"
      id="todayDate"
    ></p>

    <!-- STATUS -->

    <div class="status-box">

      <h4>Today's Attendance Status</h4>

      <h2
        id="statusText"
        class="text-danger"
      >

        Loading...

      </h2>

    </div>

    <!-- INTERACTIVE MAP PREVIEW -->
    <div class="mb-4">
      <h5 class="text-secondary mb-2">📍 Live GPS & 500m Geo-Fence Map</h5>
      <div id="map" style="height: 280px; border-radius: 14px; z-index: 1;" class="shadow-sm border"></div>
    </div>

    <!-- BUTTONS -->

    <div class="row g-3">

      <!-- CHECK IN -->

      <div class="col-md-4 d-grid">

        <button
          class="btn btn-success big-btn"
          id="checkInBtn"
        >

          ✅ Check In

        </button>

      </div>

      <!-- CHECK OUT -->

      <div class="col-md-4 d-grid">

        <button
          class="btn btn-danger big-btn"
          id="checkOutBtn"
        >

          🔴 Check Out

        </button>

      </div>

      <!-- HISTORY -->

      <div class="col-md-4 d-grid">

        <button
          class="btn btn-secondary big-btn"
          onclick="goToHistory()"
        >

          📊 View History

        </button>

      </div>

    </div>

  </div>

<script src="config.js"></script>
<script>

  // ===== ROLE VALIDATION =====

  if (
      localStorage.getItem("role")
      !== "DOCTOR"
     ) {

    window.location.href = "index.html";

  }

  // ===== TODAY DATE =====

  const today = new Date();

  document.getElementById(
    "todayDate"
  ).innerText = today.toDateString();

  // ===== DOCTOR NAME =====

  const doctorName =
    localStorage.getItem("doctorName");

  document.getElementById(
    "doctorName"
  ).innerText = doctorName;

  // ===== DOCTOR ID =====

  const doctorId =
    localStorage.getItem("doctorId");

  if (
      !doctorId
      ||
      doctorId === "undefined"
      ||
      doctorId === "null"
     ) {

    alert(
      "Session expired. Please login again."
    );

    localStorage.clear();

    window.location.href = "index.html";

  }

  // ===== LEAFLET MAP SETUP =====
  let map, userMarker, fenceCircle;

  function initMap(lat, lng) {
      if (!map) {
          map = L.map('map').setView([lat, lng], 14);
          L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
              maxZoom: 19,
              attribution: '© OpenStreetMap'
          }).addTo(map);

          userMarker = L.marker([lat, lng]).addTo(map)
              .bindPopup("📍 Your Live Position")
              .openPopup();

          fenceCircle = L.circle([lat, lng], {
              color: '#2563eb',
              fillColor: '#60a5fa',
              fillOpacity: 0.2,
              radius: 500
          }).addTo(map);
      } else {
          map.setView([lat, lng], 14);
          userMarker.setLatLng([lat, lng]);
          fenceCircle.setLatLng([lat, lng]);
      }
  }

  if (navigator.geolocation) {
      navigator.geolocation.getCurrentPosition(
          (pos) => initMap(pos.coords.latitude, pos.coords.longitude),
          () => console.log("GPS preview pending permission")
      );
  }

  // ===== LOAD STATUS =====

  document.addEventListener(
    "DOMContentLoaded",
    loadStatus
  );

  function loadStatus() {

    fetch(
      `${API_BASE_URL}/attendance/status/${doctorId}`
    )

    .then(res => res.json())

    .then(data => {

      if (
          data
          &&
          data.status
         ) {

        updateStatusUI(
          data.status
        );

      }

      else {

        updateStatusUI(
          "NOT_CHECKED"
        );

      }

    })

    .catch(error => {

      console.error(
        "Status error:",
        error
      );

      updateStatusUI(
        "NOT_CHECKED"
      );

    });

  }

  // ===== CHECK IN =====

  document.getElementById("checkInBtn").addEventListener("click", () => {
      if (!navigator.geolocation) {
          alert("Geolocation is not supported by your browser.");
          return;
      }

      navigator.geolocation.getCurrentPosition(
          (position) => {
              const latitude = position.coords.latitude;
              const longitude = position.coords.longitude;
              initMap(latitude, longitude);

              fetch(`${API_BASE_URL}/attendance/checkin`, {
                  method: "POST",
                  headers: {
                      "Content-Type": "application/json"
                  },
                  body: JSON.stringify({
                      doctorId: Number(doctorId),
                      latitude: latitude,
                      longitude: longitude
                  })
              })
              .then(res => res.json())
              .then(data => {
                  alert(data.message);
                  loadStatus();
              })
              .catch(error => {
                  console.error("Check-in error:", error);
                  alert("Check-in request failed. Please check server connection.");
              });
          },
          (error) => {
              console.error("GPS location error:", error);
              alert("Location permission denied or unavailable. Please enable GPS.");
          }
      );
  });

  // ===== CHECK OUT =====

  document.getElementById(
    "checkOutBtn"
  )

  .addEventListener(
    "click",
    () => {

      fetch(

        `${API_BASE_URL}/attendance/checkout`,

        {

          method: "PUT",

          headers: {

            "Content-Type":
              "application/json"

          },

          body: JSON.stringify({

            doctorId:
              Number(doctorId)

          })

        }

      )

      .then(res => res.json())

      .then(data => {

        alert(
          data.message
        );

        updateStatusUI(
          "COMPLETED"
        );

        loadStatus();

      })

      .catch(error => {

        console.error(
          "Check-out error:",
          error
        );

        alert(
          "Check-out failed."
        );

      });

    }

  );

  // ===== STATUS UI =====

  function updateStatusUI(status) {

    const statusText =
      document.getElementById(
        "statusText"
      );

    // PRESENT

    if (

      status === "PRESENT"

      ||

      status === "CHECKED_IN"

    ) {

      statusText.innerText =
        "Checked In";

      statusText.className =
        "text-success";

    }

    // COMPLETED

    else if (

      status === "COMPLETED"

      ||

      status === "CHECKED_OUT"

    ) {

      statusText.innerText =
        "Checked Out";

      statusText.className =
        "text-primary";

    }

    // ABSENT

    else if (

      status === "ABSENT"

    ) {

      statusText.innerText =
        "Absent";

      statusText.className =
        "text-danger";

    }

    // DEFAULT

    else {

      statusText.innerText =
        "Not Checked In";

      statusText.className =
        "text-danger";

    }

  }

  // ===== LOGOUT =====

  function logout() {

    localStorage.clear();

    window.location.href =
      "index.html";

  }

  // ===== HISTORY PAGE =====

  function goToHistory() {

    window.location.href =
      "attendanceHistory.html";

  }

</script>

</body>

</html>
