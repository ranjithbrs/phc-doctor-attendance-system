<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Doctor Dashboard - PHC Attendance</title>
  <meta name="description" content="Doctor dashboard for geo-fenced check-in and attendance tracking at PHC.">
  <link rel="stylesheet" href="style.css">
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">
  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
</head>
<body>

<div class="page-bg">
<div class="dashboard-wrapper" style="max-width:900px;">

  <!-- Top Bar -->
  <div class="topbar">
    <div class="topbar-brand">
      <div class="topbar-icon">👨‍⚕️</div>
      <div>
        <div class="topbar-title">Dr. <span id="doctorName"></span></div>
        <div class="topbar-subtitle" id="todayDate"></div>
      </div>
    </div>
    <button class="btn btn-secondary" onclick="logout()">⬅ Logout</button>
  </div>

  <!-- Attendance Status Banner -->
  <div class="status-banner">
    <div class="status-label">Today's Attendance Status</div>
    <div class="status-value absent" id="statusText">Loading...</div>
  </div>

  <!-- Live Map -->
  <div class="map-wrapper">
    <div class="map-header">📍 Live GPS &amp; 500m Geo-Fence Map</div>
    <div id="map"></div>
  </div>

  <!-- Action Buttons -->
  <div class="action-grid">
    <button class="btn btn-success btn-lg" id="checkInBtn">✅ Check In</button>
    <button class="btn btn-danger btn-lg"  id="checkOutBtn">🔴 Check Out</button>
    <button class="btn btn-secondary btn-lg" onclick="goToHistory()">📊 View History</button>
  </div>

  <!-- Alert message -->
  <div class="alert" id="alertMsg"></div>

</div>
</div>

<script src="config.js"></script>
<script>

// Session & role check
if (localStorage.getItem("role") !== "DOCTOR") {
  window.location.href = "index.html";
}

const doctorId   = localStorage.getItem("doctorId");
const doctorName = localStorage.getItem("doctorName") || "Doctor";

if (!doctorId || doctorId === "undefined" || doctorId === "null") {
  alert("Session expired. Please login again.");
  localStorage.clear();
  window.location.href = "index.html";
}

document.getElementById("doctorName").innerText = doctorName;
document.getElementById("todayDate").innerText  = new Date().toDateString();

// ===== MAP =====
let map, userMarker, fenceCircle;

function initMap(lat, lng) {
  if (!map) {
    map = L.map('map').setView([lat, lng], 15);
    L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
      maxZoom: 19, attribution: '© OpenStreetMap'
    }).addTo(map);

    userMarker = L.marker([lat, lng]).addTo(map)
      .bindPopup("📍 Your Live Position").openPopup();

    fenceCircle = L.circle([lat, lng], {
      color: '#2563eb', fillColor: '#60a5fa',
      fillOpacity: 0.15, radius: 500
    }).addTo(map);
  } else {
    map.setView([lat, lng], 15);
    userMarker.setLatLng([lat, lng]);
    fenceCircle.setLatLng([lat, lng]);
  }
}

// Initial map center (Default PHC location)
const DEFAULT_LAT = 11.0168;
const DEFAULT_LNG = 76.9558;

// Initialize map with default center immediately on load
document.addEventListener("DOMContentLoaded", () => {
  initMap(DEFAULT_LAT, DEFAULT_LNG);
  loadStatus();
  if (navigator.geolocation) {
    navigator.geolocation.getCurrentPosition(
      pos => initMap(pos.coords.latitude, pos.coords.longitude),
      ()  => console.log("Using default map center until GPS is permitted")
    );
  }
});

// ===== ALERT HELPER =====
function showAlert(msg, type = "success") {
  const el = document.getElementById("alertMsg");
  el.textContent = msg;
  el.className = `alert alert-${type} show`;
  setTimeout(() => el.classList.remove("show"), 4500);
}

// ===== LOAD STATUS =====
function loadStatus() {
  fetch(`${API_BASE_URL}/attendance/status/${doctorId}`)
    .then(res => res.json())
    .then(data => updateStatusUI(data && data.status ? data.status : "NOT_CHECKED"))
    .catch(() => updateStatusUI("NOT_CHECKED"));
}

function updateStatusUI(status) {
  const el = document.getElementById("statusText");
  const map = {
    PRESENT:     { text: "✅ Checked In",  cls: "present" },
    CHECKED_IN:  { text: "✅ Checked In",  cls: "present" },
    COMPLETED:   { text: "🔵 Checked Out", cls: "present" },
    CHECKED_OUT: { text: "🔵 Checked Out", cls: "present" },
    ABSENT:      { text: "❌ Absent",       cls: "absent"  },
  };
  const s = map[status] || { text: "❌ Not Checked In", cls: "absent" };
  el.textContent  = s.text;
  el.className    = `status-value ${s.cls}`;
}

// ===== CHECK IN =====
document.getElementById("checkInBtn").addEventListener("click", () => {
  if (!navigator.geolocation) {
    showAlert("Geolocation not supported by your browser.", "danger");
    return;
  }

  const btn = document.getElementById("checkInBtn");
  btn.innerHTML = '<span class="spinner"></span> Getting location...';
  btn.disabled = true;

  navigator.geolocation.getCurrentPosition(
    pos => {
      const { latitude, longitude } = pos.coords;
      initMap(latitude, longitude);

      fetch(`${API_BASE_URL}/attendance/checkin`, {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ doctorId: Number(doctorId), latitude, longitude })
      })
      .then(res => res.json())
      .then(data => {
        const msg = data.message || "";
        const isError = msg.includes("ABSENT") || msg.includes("Outside") || msg.includes("failed") || msg.includes("Invalid");
        showAlert(msg, isError ? "danger" : "success");
        loadStatus();
        btn.innerHTML = "✅ Check In";
        btn.disabled  = false;
      })
      .catch(() => {
        showAlert("Check-in failed. Please try again.", "danger");
        btn.innerHTML = "✅ Check In";
        btn.disabled  = false;
      });
    },
    () => {
      showAlert("GPS permission denied. Please enable location access.", "danger");
      btn.innerHTML = "✅ Check In";
      btn.disabled  = false;
    }
  );
});

// ===== CHECK OUT =====
document.getElementById("checkOutBtn").addEventListener("click", () => {
  const btn = document.getElementById("checkOutBtn");
  btn.innerHTML = '<span class="spinner"></span> Checking out...';
  btn.disabled  = true;

  fetch(`${API_BASE_URL}/attendance/checkout`, {
    method: "PUT",
    headers: { "Content-Type": "application/json" },
    body: JSON.stringify({ doctorId: Number(doctorId) })
  })
  .then(res => res.json())
  .then(data => {
    const msg = data.message || "";
    const isError = msg.includes("Cannot") || msg.includes("failed") || msg.includes("No active") || msg.includes("Invalid") || msg.includes("Already");
    showAlert(msg, isError ? "danger" : "success");
    loadStatus();
    btn.innerHTML = "🔴 Check Out";
    btn.disabled  = false;
  })
  .catch(() => {
    showAlert("Check-out failed. Please try again.", "danger");
    btn.innerHTML = "🔴 Check Out";
    btn.disabled  = false;
  });
});

function logout()      { localStorage.clear(); window.location.href = "index.html"; }
function goToHistory() { window.location.href = "attendanceHistory.html"; }

</script>
</body>
</html>
