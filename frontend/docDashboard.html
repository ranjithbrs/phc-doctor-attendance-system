<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Doctor Dashboard</title>

  <!-- Bootstrap -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

  <style>
    body {
      background: linear-gradient(135deg, #eef2ff, #f8fafc);
      min-height: 100vh;
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
    }

    .dashboard-card {
      max-width: 900px;
      margin: 40px auto;
      border-radius: 18px;
      background: white;
      box-shadow: 0 10px 25px rgba(0,0,0,0.08);
      padding: 30px;
    }

    .status-box {
      border-radius: 14px;
      background: #f1f5f9;
      padding: 20px;
      text-align: center;
      margin-bottom: 25px;
    }

    .big-btn {
      padding: 14px;
      font-size: 18px;
      border-radius: 12px;
      font-weight: 600;
    }

    .header-title {
      font-weight: 700;
    }

    .date-text {
      color: #64748b;
      font-size: 14px;
    }
  </style>
</head>
<body>

<div class="container">
  <div class="dashboard-card">

    <!-- Header -->
    <div class="text-center mb-4">
      <h2 class="header-title">👨‍⚕️ Doctor Dashboard</h2>
      <p class="date-text" id="todayDate"></p>
    </div>

    <!-- Status Card -->
    <div class="status-box">
      <h5>Today's Attendance Status</h5>
      <h4 id="statusText" class="text-danger">Not Checked In</h4>
    </div>

    <!-- Action Buttons -->
    <div class="row g-3">
      <div class="col-md-4 d-grid">
        <button class="btn btn-success big-btn" id="checkInBtn">✅ Check In</button>
      </div>

      <div class="col-md-4 d-grid">
        <button class="btn btn-danger big-btn" id="checkOutBtn">🔴 Check Out</button>
      </div>

      <div class="col-md-4 d-grid">
        <button class="btn btn-secondary big-btn" onclick="goToHistory()">📊 View History</button>
      </div>
    </div>

  </div>
</div>

<script>
// ===== Show today's date =====
const today = new Date();
document.getElementById("todayDate").innerText = today.toDateString();

// ===== Check-In Click =====
document.getElementById("checkInBtn").addEventListener("click", () => {
  console.log("Check-in clicked");
  document.getElementById("statusText").innerText = "Checked In";
  document.getElementById("statusText").className = "text-success";
});

// ===== Check-Out Click =====
document.getElementById("checkOutBtn").addEventListener("click", () => {
  console.log("Check-out clicked");
  document.getElementById("statusText").innerText = "Checked Out";
  document.getElementById("statusText").className = "text-primary";
});

// ===== Navigate to history =====
function goToHistory() {
  window.location.href = "attendanceHistory.html";
}
</script>

</body>
</html>
