<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Doctor Dashboard</title>

  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

  <style>
    body {
      background: linear-gradient(135deg, #eef2ff, #f8fafc);
      min-height: 100vh;
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
    }

    .dashboard-card {
      max-width: 900px;
      margin: 40px auto;
      border-radius: 18px;
      background: white;
      box-shadow: 0 10px 25px rgba(0,0,0,0.08);
      padding: 30px;
    }

    .status-box {
      border-radius: 14px;
      background: #f1f5f9;
      padding: 20px;
      text-align: center;
      margin-bottom: 25px;
    }

    .big-btn {
      padding: 14px;
      font-size: 18px;
      border-radius: 12px;
      font-weight: 600;
    }

    .header-title {
      font-weight: 700;
    }

    .date-text {
      color: #64748b;
      font-size: 14px;
    }
  </style>
</head>
<body>

<div class="container">
  <div class="dashboard-card">

    <!-- Header with Logout -->
    <div class="d-flex justify-content-between align-items-center mb-3">
      <h2 class="header-title m-0">👨‍⚕️ Doctor Dashboard</h2>
      <button class="btn btn-secondary" onclick="logout()">Logout</button>
    </div>

    <p class="date-text text-center mb-4" id="todayDate"></p>

    <!-- Status Card -->
    <div class="status-box">
      <h5>Today's Attendance Status</h5>
      <h4 id="statusText" class="text-danger">Loading...</h4>
    </div>

    <!-- Action Buttons -->
    <div class="row g-3">
      <div class="col-md-4 d-grid">
        <button class="btn btn-success big-btn" id="checkInBtn">✅ Check In</button>
      </div>

      <div class="col-md-4 d-grid">
        <button class="btn btn-danger big-btn" id="checkOutBtn">🔴 Check Out</button>
      </div>

      <div class="col-md-4 d-grid">
        <button class="btn btn-secondary big-btn" onclick="goToHistory()">📊 View History</button>
      </div>
    </div>

  </div>
</div>

<script>

// ===== Show today's date =====
const today = new Date();
document.getElementById("todayDate").innerText = today.toDateString();

// ===== Get Doctor ID =====
const doctorId = localStorage.getItem("doctorId");

if (!doctorId || doctorId === "undefined" || doctorId === "null") {
  alert("Session expired. Please login again.");
  localStorage.clear();
  window.location.href = "index.html";
}

// ===== Load Status on Page Load =====
document.addEventListener("DOMContentLoaded", loadStatus);

// ===== Load Status =====
function loadStatus() {
  fetch(`http://localhost:8080/attendance/status/${doctorId}`)
    .then(res => res.json())
    .then(data => {
      if (data && data.status) {
        updateStatusUI(data.status);
      } else {
        updateStatusUI("NOT_CHECKED");
      }
    })
    .catch(error => {
      console.error("Status error:", error);
      updateStatusUI("NOT_CHECKED");
    });
}

// ===== Check In =====
document.getElementById("checkInBtn").addEventListener("click", () => {

  fetch("http://localhost:8080/attendance/checkin", {
    method: "POST",
    headers: { "Content-Type": "application/json" },
    body: JSON.stringify({ doctorId: Number(doctorId) })
  })
  .then(res => res.json())
  .then(data => {
    alert(data.message);
    loadStatus();
  })
  .catch(error => {
    console.error("Check-in error:", error);
    alert("Check-in failed.");
  });

});

// ===== Check Out =====
document.getElementById("checkOutBtn").addEventListener("click", () => {

  fetch("http://localhost:8080/attendance/checkout", {
    method: "PUT",
    headers: { "Content-Type": "application/json" },
    body: JSON.stringify({ doctorId: Number(doctorId) })
  })
  .then(res => res.json())
  .then(data => {
    alert(data.message);
    loadStatus();
  })
  .catch(error => {
    console.error("Check-out error:", error);
    alert("Check-out failed.");
  });

});

// ===== Update UI =====
function updateStatusUI(status) {

  const statusText = document.getElementById("statusText");

  if (status === "PRESENT" || status === "Checked in") {
    statusText.innerText = "Checked In";
    statusText.className = "text-success";
  }
  else if (status === "COMPLETED" || status === "Checked out") {
    statusText.innerText = "Checked Out";
    statusText.className = "text-primary";
  }
  else {
    statusText.innerText = "Not Checked In";
    statusText.className = "text-danger";
  }
}

// ===== Logout =====
function logout() {
  localStorage.clear();
  window.location.href = "index.html";
}

// ===== Navigate to History =====
function goToHistory() {
  window.location.href = "attendanceHistory.html";
}

</script>

</body>
</html>
