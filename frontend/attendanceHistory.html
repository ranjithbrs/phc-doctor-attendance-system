<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Attendance History - PHC Attendance</title>
  <meta name="description" content="View and filter your attendance history with check-in and check-out records.">
  <link rel="stylesheet" href="style.css">
</head>
<body>

<div class="page-bg">
<div class="dashboard-wrapper">

  <!-- Top Bar -->
  <div class="topbar">
    <div class="topbar-brand">
      <div class="topbar-icon">📊</div>
      <div>
        <div class="topbar-title">Attendance History</div>
        <div class="topbar-subtitle" id="doctorSubtitle">Loading...</div>
      </div>
    </div>
    <button class="btn btn-secondary" onclick="goBack()">⬅ Back</button>
  </div>

  <!-- Filter Section -->
  <div class="filter-row">
    <div>
      <label class="form-label" for="fromDate">From Date</label>
      <input type="date" class="form-control" id="fromDate">
    </div>
    <div>
      <label class="form-label" for="toDate">To Date</label>
      <input type="date" class="form-control" id="toDate">
    </div>
    <div>
      <button class="btn btn-primary" onclick="filterHistory()">🔍 Filter</button>
    </div>
  </div>

  <!-- Table -->
  <div class="table-wrapper">
    <div class="table-header">📅 Attendance Records</div>
    <div style="overflow-x:auto;">
      <table class="data-table">
        <thead>
          <tr>
            <th>Date</th>
            <th>Check In</th>
            <th>Check Out</th>
            <th>Status</th>
          </tr>
        </thead>
        <tbody id="historyTable">
          <tr><td colspan="4" class="text-muted" style="padding:30px;">Loading...</td></tr>
        </tbody>
      </table>
    </div>
  </div>

</div>
</div>

<script src="config.js"></script>
<script>

const doctorId = localStorage.getItem("doctorId");
const doctorName = localStorage.getItem("doctorName") || "Doctor";

if (!doctorId || doctorId === "undefined" || doctorId === "null") {
  alert("Session expired. Please login again.");
  localStorage.clear();
  window.location.href = "index.html";
}

document.getElementById("doctorSubtitle").textContent = `Dr. ${doctorName} · Attendance Log`;

document.addEventListener("DOMContentLoaded", () => loadHistory());

function loadHistory(fromDate = "", toDate = "") {
  let url = `${API_BASE_URL}/attendance/history/${doctorId}`;
  if (fromDate && toDate) url += `?from=${fromDate}&to=${toDate}`;

  const tableBody = document.getElementById("historyTable");
  tableBody.innerHTML = `<tr><td colspan="4" class="text-muted" style="padding:24px;">Loading...</td></tr>`;

  fetch(url)
    .then(res => res.json())
    .then(data => renderTable(data))
    .catch(() => {
      tableBody.innerHTML = `<tr><td colspan="4" class="text-danger" style="padding:24px;">Failed to load history</td></tr>`;
    });
}

function renderTable(records) {
  const tableBody = document.getElementById("historyTable");
  tableBody.innerHTML = "";

  if (!records || records.length === 0) {
    tableBody.innerHTML = `<tr><td colspan="4" class="text-muted" style="padding:30px;">No records found for selected period</td></tr>`;
    return;
  }

  records.forEach(record => {
    let badgeClass = "badge-danger";
    if (record.status === "PRESENT")   badgeClass = "badge-success";
    if (record.status === "COMPLETED") badgeClass = "badge-primary";

    tableBody.innerHTML += `
      <tr>
        <td style="font-weight:600;">${record.date}</td>
        <td>${record.checkInTime  ? `<span class="text-success fw-bold">${record.checkInTime}</span>`  : '<span class="text-muted">—</span>'}</td>
        <td>${record.checkOutTime ? `<span class="text-primary fw-bold">${record.checkOutTime}</span>` : '<span class="text-muted">—</span>'}</td>
        <td><span class="badge ${badgeClass}">${record.status}</span></td>
      </tr>
    `;
  });
}

function filterHistory() {
  const fromDate = document.getElementById("fromDate").value;
  const toDate   = document.getElementById("toDate").value;

  if (!fromDate || !toDate) { alert("Please select both dates"); return; }
  if (new Date(fromDate) > new Date(toDate)) { alert("From date cannot be after To date"); return; }

  loadHistory(fromDate, toDate);
}

function goBack() {
  window.location.href = "docDashboard.html";
}

</script>
</body>
</html>
