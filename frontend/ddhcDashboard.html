<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>DDHS Central Dashboard - PHC Attendance</title>
  <meta name="description" content="DDHS admin dashboard for monitoring PHC doctor attendance across all health centres.">
  <link rel="stylesheet" href="style.css">
</head>
<body>

<div class="page-bg">
<div class="dashboard-wrapper">

  <!-- Top Bar -->
  <div class="topbar">
    <div class="topbar-brand">
      <div class="topbar-icon">🏥</div>
      <div>
        <div class="topbar-title">DDHS Central Dashboard</div>
        <div class="topbar-subtitle">District Health Surveillance · Real-time Overview</div>
      </div>
    </div>
    <button class="btn btn-secondary" onclick="logout()">⬅ Logout</button>
  </div>

  <!-- Stat Cards -->
  <div class="stats-grid">
    <div class="stat-card stat-card-phc">
      <div class="stat-label">Total PHCs</div>
      <div class="stat-value" id="totalPhc">—</div>
      <div class="stat-icon">🏥</div>
    </div>
    <div class="stat-card stat-card-total">
      <div class="stat-label">Total Doctors</div>
      <div class="stat-value" id="totalDoctors">—</div>
      <div class="stat-icon">👨‍⚕️</div>
    </div>
    <div class="stat-card stat-card-present">
      <div class="stat-label">Present Today</div>
      <div class="stat-value" id="presentDoctors">—</div>
      <div class="stat-icon">✅</div>
    </div>
    <div class="stat-card stat-card-absent">
      <div class="stat-label">Absent Today</div>
      <div class="stat-value" id="absentDoctors">—</div>
      <div class="stat-icon">❌</div>
    </div>
  </div>

  <!-- PHC Table -->
  <div class="table-wrapper">
    <div class="table-header">📋 PHC Attendance Overview</div>
    <div style="overflow-x:auto;">
      <table class="data-table">
        <thead>
          <tr>
            <th>PHC Name</th>
            <th>Total Doctors</th>
            <th>Present</th>
            <th>Absent</th>
            <th>Attendance %</th>
          </tr>
        </thead>
        <tbody id="phcTable">
          <tr><td colspan="5" class="text-muted" style="padding:30px;">Loading data...</td></tr>
        </tbody>
      </table>
    </div>
  </div>

</div>
</div>

<script src="config.js"></script>
<script>

// Role protection
if (localStorage.getItem("role") !== "ADMIN") {
  window.location.href = "index.html";
}

function logout() {
  localStorage.clear();
  window.location.href = "index.html";
}

const divisionId = 1;

// Load summary stats
fetch(`${API_BASE_URL}/dashboard/summary/${divisionId}`)
  .then(res => res.json())
  .then(data => {
    document.getElementById("totalPhc").innerText      = data.totalPhc;
    document.getElementById("totalDoctors").innerText  = data.totalDoctors;
    document.getElementById("presentDoctors").innerText = data.presentDoctors;
    document.getElementById("absentDoctors").innerText  = data.absentDoctors;
  })
  .catch(() => {});

// Load PHC table
const table = document.getElementById("phcTable");

fetch(`${API_BASE_URL}/dashboard/phc-overview/${divisionId}`)
  .then(res => res.json())
  .then(data => {
    table.innerHTML = "";
    data.forEach(phc => {
      const pct = phc.percentage;
      const badgeClass = pct >= 75 ? "badge-success" : pct >= 50 ? "badge-warning" : "badge-danger";
      table.innerHTML += `
        <tr>
          <td style="font-weight:600;text-align:left;padding-left:24px;">${phc.phcName}</td>
          <td>${phc.totalDoctors}</td>
          <td><span class="fw-bold text-success">${phc.present}</span></td>
          <td><span class="fw-bold text-danger">${phc.absent}</span></td>
          <td><span class="badge ${badgeClass}">${pct}%</span></td>
        </tr>
      `;
    });
  })
  .catch(() => {
    table.innerHTML = "<tr><td colspan='5' class='text-danger' style='padding:24px;'>Error loading data</td></tr>";
  });

</script>
</body>
</html>
