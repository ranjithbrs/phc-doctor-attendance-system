<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>DDHS Dashboard</title>

  <!-- Bootstrap -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

  <style>
    body {
      background: #f1f5f9;
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
    }

    .dashboard-container {
      max-width: 1200px;
      margin: 40px auto;
    }

    .header-card {
      background: white;
      border-radius: 16px;
      padding: 25px;
      box-shadow: 0 10px 25px rgba(0,0,0,0.08);
      margin-bottom: 25px;
    }

    .stat-card {
      border-radius: 16px;
      padding: 20px;
      color: white;
      font-weight: 600;
      box-shadow: 0 8px 20px rgba(0,0,0,0.08);
    }

    .bg-total { background: linear-gradient(135deg, #3b82f6, #2563eb); }
    .bg-present { background: linear-gradient(135deg, #10b981, #059669); }
    .bg-absent { background: linear-gradient(135deg, #ef4444, #dc2626); }
    .bg-phc { background: linear-gradient(135deg, #6366f1, #4f46e5); }

    .stat-number {
      font-size: 28px;
      font-weight: 700;
    }

    .table-card {
      background: white;
      border-radius: 16px;
      padding: 20px;
      box-shadow: 0 10px 25px rgba(0,0,0,0.08);
    }

    table th {
      background: #e2e8f0;
    }
  </style>
</head>
<body>

<div class="container dashboard-container">

  <!-- Header -->
  <div class="header-card d-flex justify-content-between align-items-center">
    <h3 class="m-0">🏥 DDHS Central Dashboard</h3>
    <button class="btn btn-secondary" onclick="logout()">Logout</button>
  </div>

  <!-- Statistics Row -->
  <div class="row g-4 mb-4">

    <div class="col-md-3">
      <div class="stat-card bg-phc text-center">
        <div>Total PHCs</div>
        <div class="stat-number" id="totalPhc">24</div>
      </div>
    </div>

    <div class="col-md-3">
      <div class="stat-card bg-total text-center">
        <div>Total Doctors</div>
        <div class="stat-number" id="totalDoctors">120</div>
      </div>
    </div>

    <div class="col-md-3">
      <div class="stat-card bg-present text-center">
        <div>Present Today</div>
        <div class="stat-number" id="presentDoctors">98</div>
      </div>
    </div>

    <div class="col-md-3">
      <div class="stat-card bg-absent text-center">
        <div>Absent Today</div>
        <div class="stat-number" id="absentDoctors">22</div>
      </div>
    </div>

  </div>

  <!-- PHC Table -->
  <div class="table-card">
    <h5 class="mb-3">📋 PHC Attendance Overview</h5>

    <div class="table-responsive">
      <table class="table table-bordered table-hover text-center">
        <thead>
          <tr>
            <th>PHC Name</th>
            <th>Total Doctors</th>
            <th>Present</th>
            <th>Absent</th>
            <th>Attendance %</th>
          </tr>
        </thead>
        <tbody id="phcTable">
          <!-- Dummy rows for demo -->
          <tr>
            <td>PHC - Madurai East</td>
            <td>10</td>
            <td class="text-success">8</td>
            <td class="text-danger">2</td>
            <td><span class="badge bg-success">80%</span></td>
          </tr>
          <tr>
            <td>PHC - Trichy Rural</td>
            <td>12</td>
            <td class="text-success">9</td>
            <td class="text-danger">3</td>
            <td><span class="badge bg-warning text-dark">75%</span></td>
          </tr>
        </tbody>
      </table>
    </div>
  </div>

</div>

<script>
function logout() {
  alert("Logout clicked (connect backend later)");
}
</script>

</body>
</html>
