<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>PHC Doctor Attendance System - Login</title>
  <meta name="description" content="Login to PHC Doctor Attendance System - Geo-fenced attendance tracking for doctors.">
  <link rel="stylesheet" href="style.css">
</head>
<body>

<div class="login-wrapper">
  <div class="login-card">
    <div class="login-logo">🏥</div>
    <h1 class="login-title">PHC Attendance System</h1>
    <p class="login-subtitle">Primary Health Centre · Doctor Portal</p>

    <form id="loginForm">
      <div class="form-group">
        <label class="form-label" for="email">Email Address</label>
        <input type="email" class="form-control" id="email" placeholder="doctor@phc.gov.in" required>
      </div>

      <div class="form-group">
        <label class="form-label" for="password">Password</label>
        <input type="password" class="form-control" id="password" placeholder="••••••••" required>
      </div>

      <button type="submit" class="btn btn-primary btn-full btn-lg" id="loginBtn">
        Sign In
      </button>
    </form>

    <div class="alert alert-danger" id="errorMsg"></div>
    <div class="alert alert-success" id="successMsg"></div>
  </div>
</div>

<script src="config.js"></script>
<script>
document.getElementById("loginForm").addEventListener("submit", async function(e) {
  e.preventDefault();

  const email    = document.getElementById("email").value;
  const password = document.getElementById("password").value;
  const btn      = document.getElementById("loginBtn");
  const errorMsg   = document.getElementById("errorMsg");
  const successMsg = document.getElementById("successMsg");

  errorMsg.classList.remove("show");
  successMsg.classList.remove("show");

  btn.innerHTML = '<span class="spinner"></span> Signing in...';
  btn.disabled = true;

  try {
    const response = await fetch(`${API_BASE_URL}/auth/login`, {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ email, password })
    });

    const data = await response.json();

    if (!response.ok) {
      errorMsg.textContent = data.message || "Invalid email or password";
      errorMsg.classList.add("show");
      btn.innerHTML = "Sign In";
      btn.disabled = false;
      return;
    }

    localStorage.setItem("doctorId",   data.doctorId);
    localStorage.setItem("doctorName", data.name);
    localStorage.setItem("role",       data.role);

    successMsg.textContent = "Login successful! Redirecting...";
    successMsg.classList.add("show");

    setTimeout(() => {
      window.location.href = data.role === "ADMIN" ? "ddhcDashboard.html" : "docDashboard.html";
    }, 800);

  } catch (error) {
    console.error(error);
    errorMsg.textContent = "Server error. Please try again.";
    errorMsg.classList.add("show");
    btn.innerHTML = "Sign In";
    btn.disabled = false;
  }
});
</script>
</body>
</html>
