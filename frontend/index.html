<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>PHC Doctor Attendance System - Login</title>
  <meta name="description" content="Login to PHC Doctor Attendance System - Geo-fenced attendance tracking for doctors.">
  <link rel="manifest" href="manifest.json">
  <meta name="theme-color" content="#2563eb">
  <link rel="stylesheet" href="style.css">
</head>
<body>

<div class="login-wrapper">
  <div class="login-card">
    <div class="login-logo">🏥</div>
    <h1 class="login-title">PHC Attendance System</h1>
    <p class="login-subtitle">Primary Health Centre · Doctor Portal</p>

    <form id="loginForm">
      <div class="form-group">
        <label class="form-label" for="email">Email Address</label>
        <input type="email" class="form-control" id="email" placeholder="doctor@phc.gov.in" required>
      </div>

      <div class="form-group">
        <label class="form-label" for="password">Password</label>
        <input type="password" class="form-control" id="password" placeholder="••••••••" required>
      </div>

      <button type="submit" class="btn btn-primary btn-full btn-lg" id="loginBtn">
        Sign In
      </button>

      <p class="text-center mt-3 text-muted" style="font-size:14px;">
        Don't have an account? <a href="register.html" style="color:var(--primary); font-weight:600; text-decoration:none;">Create Account</a>
      </p>
    </form>

    <div class="alert alert-danger" id="errorMsg"></div>
    <div class="alert alert-success" id="successMsg"></div>

    <div style="margin-top:20px; padding:12px; background:#f8fafc; border:1px solid #e2e8f0; border-radius:8px; font-size:12px; text-align:center;">
      <span style="color:#64748b;">API Backend: </span>
      <strong id="connectedApiLabel" style="color:#2563eb; word-break:break-all;">Detecting...</strong>
      <div style="margin-top:6px;">
        <button type="button" onclick="switchBackend('http://localhost:8080')" style="background:#e0e7ff; color:#3730a3; border:none; padding:4px 8px; border-radius:4px; font-size:11px; cursor:pointer; margin-right:6px;">Use Local (8080)</button>
        <button type="button" onclick="switchBackend('https://phc-doctor-attendance-system.onrender.com')" style="background:#dcfce7; color:#166534; border:none; padding:4px 8px; border-radius:4px; font-size:11px; cursor:pointer;">Use Render Cloud</button>
      </div>
    </div>
  </div>
</div>

<script src="config.js"></script>
<script>
document.getElementById("loginForm").addEventListener("submit", async function(e) {
  e.preventDefault();

  const email    = document.getElementById("email").value;
  const password = document.getElementById("password").value;
  const btn      = document.getElementById("loginBtn");
  const errorMsg   = document.getElementById("errorMsg");
  const successMsg = document.getElementById("successMsg");

  errorMsg.classList.remove("show");
  successMsg.classList.remove("show");

  btn.innerHTML = '<span class="spinner"></span> Signing in...';
  btn.disabled = true;

  let deviceId = getSafeStorage("PHC_DEVICE_ID");
  if (!deviceId) {
    deviceId = "PHC_DEV_" + Math.random().toString(36).substring(2, 11) + Date.now().toString(36);
    setSafeStorage("PHC_DEVICE_ID", deviceId);
  }

  try {
    const response = await fetch(`${API_BASE_URL}/auth/login`, {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ email, password, deviceId })
    });

    const data = await response.json();

    if (!response.ok) {
      errorMsg.textContent = data.error || data.message || "Invalid email or password";
      errorMsg.classList.add("show");
      btn.innerHTML = "Sign In";
      btn.disabled = false;
      return;
    }

    setSafeStorage("doctorId",   data.doctorId);
    setSafeStorage("doctorName", data.name);
    setSafeStorage("role",       (data.role || "DOCTOR").toUpperCase());
    if (data.token) setSafeStorage("authToken", data.token);

    successMsg.textContent = "Login successful! Redirecting...";
    successMsg.classList.add("show");

    setTimeout(() => {
      window.location.href = (data.role || "").toUpperCase() === "ADMIN" ? "ddhcDashboard.html" : "docDashboard.html";
    }, 800);

  } catch (error) {
    console.error(error);
    errorMsg.textContent = "Unable to reach backend server (" + API_BASE_URL + "). If using Render Cloud, please wait ~20s for cold-start.";
    errorMsg.classList.add("show");
    btn.innerHTML = "Sign In";
    btn.disabled = false;
  }
});

document.getElementById("connectedApiLabel").innerText = API_BASE_URL;

function switchBackend(url) {
  if (window.location.protocol === "https:" && url.startsWith("http://")) {
    alert("Browser Security Warning: HTTPS pages (like GitHub Pages) block HTTP requests to localhost due to Mixed Content security rules. To test local backend (8080), please open the app via local file:// or http://localhost.");
    return;
  }
  setSafeStorage("API_BASE_URL", url);
  window.location.reload();
}

if ('serviceWorker' in navigator) {
  window.addEventListener('load', () => {
    navigator.serviceWorker.register('sw.js')
      .then(reg => console.log('PWA ServiceWorker active:', reg.scope))
      .catch(err => console.log('ServiceWorker registration failed:', err));
  });
}
</script>
</body>
</html>
