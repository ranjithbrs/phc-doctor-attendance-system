spring.application.name=phcbackend

# Database Configuration (Defaults to embedded H2 for instant local execution, overridden by cloud env vars)
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:h2:mem:phcdb;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE;MODE=MySQL}
spring.datasource.driver-class-name=${SPRING_DATASOURCE_DRIVER:org.h2.Driver}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:sa}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:}

# Hikari Connection Pool Settings for Cloud Resilience
spring.datasource.hikari.maximum-pool-size=10
spring.datasource.hikari.minimum-idle=2
spring.datasource.hikari.connection-timeout=30000
spring.datasource.hikari.idle-timeout=600000
spring.datasource.hikari.max-lifetime=1800000

# JPA & Database Dialect Configuration
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
# spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect

# Server Port (Dynamic PORT for Render/Railway/Koyeb compatibility)
server.port=${PORT:8080}

# Database Initialization / Seeding
spring.sql.init.mode=always
spring.jpa.defer-datasource-initialization=true